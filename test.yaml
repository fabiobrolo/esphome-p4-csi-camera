# =============================================================================
# Test config for ESP32-P4 CSI Camera component
# Flash this to your JC8012P4A1C_I_W_Y board to test camera functionality
# =============================================================================

substitutions:
  name: "p4-camera-test"
  friendly_name: "P4 Camera Test"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    build_flags:
      - "-Wno-deprecated-declarations"

esp32:
  variant: esp32p4
  flash_size: 16MB
  cpu_frequency: 360MHZ
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      execute_from_psram: true
      disable_vfs_support_termios: false
      disable_vfs_support_select: false
      disable_vfs_support_dir: false

logger:
  hardware_uart: USB_SERIAL_JTAG

psram:
  mode: hex
  speed: 200MHz

# ESP32-C6 co-processor for WiFi
esp32_hosted:
  variant: esp32c6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

# LDO for MIPI PHY - managed by esp_video internally, DO NOT declare here
# esp_ldo:
#   - channel: 3
#     id: dsi_phy_enable
#     voltage: 2.5V
#     adjustable: True

# I2C bus - DISABLED to avoid conflict with esp_video's SCCB
# esp_video manages its own I2C for the camera sensor
# If you need I2C for other devices (touchscreen), add it back
# but use a different port or init esp_video first

# External component (local development path)
external_components:
  - source:
      type: local
      path: components
    components: [p4_csi_camera]

# CSI Camera configuration
p4_csi_camera:
  id: csi_cam
  name: "Panel Camera"
  resolution: 1928X1092
  data_lanes: 2
  max_framerate: 2 fps
  jpeg_quality: 40
  idle_framerate: 0.1 fps
  # reset_pin: XX  # TBD - need to identify from schematic
  # power_pin: XX  # TBD - need to identify from schematic

# Runtime-adjustable controls (appear as HA entities)
number:
  - platform: p4_csi_camera
    camera_id: csi_cam
    name: "Camera JPEG Quality"

switch:
  - platform: p4_csi_camera
    camera_id: csi_cam
    vertical_flip:
      name: "Camera Vertical Flip"
    horizontal_flip:
      name: "Camera Horizontal Flip"
